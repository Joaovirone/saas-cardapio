name: Deploy SaaS Cardápio - CI/CD

on:
  pull_request:
    branches:
      - master
    #types:
    #  - closed # Executa quando o PR é fechado

concurrency:
  group: "deploy-prd"
  cancel-in-progress: true

jobs:
  testes-automatizados:
    #if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: Executar testes
        run: mvn test -B 

  deploy-to-aws:
    needs: testes-automatizados 
    runs-on: ubuntu-latest
    #environment: production

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'corretto'
          java-version: '21'
          cache: 'maven'

      - name: Compilar o pacote (sem rodar testes novamente)
        run: mvn clean package -B -DskipTests

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Serverless Framework
        run: npm install -g serverless@3

      - name: Configurar Credenciais da AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: sa-east-1

      - name: Deploy na AWS
        run: serverless deploy --stage prd