service: saas-cardapio-api

frameworkVersion: '3'

provider:
  name: aws
  runtime: java21
  region: sa-east-1 
  memorySize: 3072
  timeout: 30
  environment:
    TABELA_PEDIDOS: Pedidos 
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:GetItem
            - dynamodb:Scan
            - dynamodb:Query
          Resource:
            - "arn:aws:dynamodb:${aws:region}:*:table/Pedidos"

package:
  artifact: target/app-0.0.1-SNAPSHOT.jar

functions:
  api:
    
    handler: com.saas_cardapio.app.handler.StreamLambdaHandler::handleRequest
    events:
      
      - httpApi:
          path: /{proxy+}
          method: '*'

resources:
  Resources:
    PedidosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: Pedidos
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        BillingMode: PAY_PER_REQUEST