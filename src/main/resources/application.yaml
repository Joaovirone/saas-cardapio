spring:
  application:
    name: cardapio-api
  main:
    lazy-initialization: true 

server:
  port: 8080
  error:
    include-stacktrace: never 
    include-message: always

app:
  seeder:
    habilitado: ${APP_SEEDER_HABILITADO:false}
  
  security:
    jwt:
      secret: ${JWT_SECRET:ChapaQuenteSaaSKeySuperSecretaParaAssinarTokensDeAcesso}
      expiration: ${JWT_EXPIRATION:36000000} 

aws:
  
  region: ${AWS_REGION:sa-east-1} 
  dynamodb:
    table:
      pedidos: ${TABELA_PEDIDOS:Pedidos}
      produtos: ${TABELA_PRODUTOS:Produtos}
      clientes: ${TABELA_CLIENTES:Clientes}
  
    endpoint: ${DYNAMODB_ENDPOINT:}